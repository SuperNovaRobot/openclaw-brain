# OpenClaw Brain — Service Layer on nova-rig (x86_64, 256GB RAM)
# Start: docker compose up -d
# Nova connects via: http://nova-rig:<port>

services:
  # === SHARED SERVICES ===

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: openclaw
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass infini_rag_flow
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "infini_rag_flow", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === RAGFLOW STACK ===

  es01:
    image: elasticsearch:8.11.3
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "1200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=infini_rag_flow
      - "ES_JAVA_OPTS=-Xms8g -Xmx8g"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:infini_rag_flow -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    ports:
      - "5455:3306"
    environment:
      MYSQL_ROOT_PASSWORD: infini_rag_flow
      MYSQL_DATABASE: rag_flow
    volumes:
      - mysqldata:/var/lib/mysql
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pinfini_rag_flow"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rag_flow
      MINIO_ROOT_PASSWORD: infini_rag_flow
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    mem_limit: 2g

  ragflow:
    image: infiniflow/ragflow:v0.24.0
    restart: unless-stopped
    ports:
      - "9380:9380"
      - "80:80"
      - "443:443"
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=infini_rag_flow
      - MYSQL_DBNAME=rag_flow
      - ES_HOST=es01
      - ELASTIC_PASSWORD=infini_rag_flow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=infini_rag_flow
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=rag_flow
      - MINIO_PASSWORD=infini_rag_flow
      - DOC_ENGINE=elasticsearch
      - HF_ENDPOINT=https://huggingface.co
      - SVR_HTTP_PORT=9380
      - TZ=America/New_York
    volumes:
      - ragflow_data:/ragflow/logs
    mem_limit: 16g
    command:
      - --enable-adminserver

  # === OPENCLAW SERVICES ===

  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    ports:
      - "5230:5230"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_DSN: "postgresql://openclaw:changeme@postgres:5432/memos?sslmode=disable"
    mem_limit: 1g

  surfsense:
    image: ghcr.io/modsetter/surfsense:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
      - "5133:5133"
    volumes:
      - surfsense_data:/data
    mem_limit: 4g

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    ports:
      - "11235:11235"
    mem_limit: 4g

volumes:
  pgdata:
  esdata:
  mysqldata:
  miniodata:
  ragflow_data:
  surfsense_data:
