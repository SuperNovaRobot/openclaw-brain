# Docker Compose V2 (no version key needed)
# vLLM backend — upgrade from llama.cpp, same :8080 endpoint

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/ssd/models:/models
    environment:
      VLLM_API_KEY: ${INFERENCE_API_KEY}
    command: >
      --model /models/${VLLM_MODEL:-nemotron-122b-awq}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL:-8}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-1048576}
      --gpu-memory-utilization 0.95
      --served-model-name ${VLLM_MODEL:-nemotron}
      --api-key ${INFERENCE_API_KEY}
      --trust-remote-code
