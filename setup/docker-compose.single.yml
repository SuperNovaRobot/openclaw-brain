# Docker Compose V2 — Single Machine (All-in-One)
# For users running brain services and inference on the same machine.
# Requires GPU for vLLM. Use docker-compose.nova.yml if inference is on a separate machine.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/ssd/pgdata:/var/lib/postgresql/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    restart: unless-stopped
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms4g -Xmx4g}
    volumes:
      - /mnt/ssd/esdata:/usr/share/elasticsearch/data
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    mem_limit: 1g

  ragflow:
    image: infiniflow/ragflow:latest
    restart: unless-stopped
    ports:
      - "${RAGFLOW_PORT:-9380}:9380"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - /mnt/ssd/ragflow-data:/ragflow/data
    mem_limit: 6g

  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    ports:
      - "${MEMOS_PORT:-5230}:5230"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/memos?sslmode=disable"
    mem_limit: 512m

  surfsense:
    image: ghcr.io/modsetter/surfsense:latest
    restart: unless-stopped
    ports:
      - "${SURFSENSE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/surfsense?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    mem_limit: 3g

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    ports:
      - "${CRAWL4AI_PORT:-11235}:11235"
    mem_limit: 3g

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/ssd/models:/models
    environment:
      VLLM_API_KEY: ${INFERENCE_API_KEY}
    command: >
      --model /models/${VLLM_MODEL:-nemotron-122b-awq}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL:-8}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-1048576}
      --gpu-memory-utilization 0.95
      --served-model-name ${VLLM_MODEL:-nemotron}
      --api-key ${INFERENCE_API_KEY}
      --trust-remote-code
