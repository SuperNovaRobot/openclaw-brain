# Docker Compose V2 (no version key needed)
# llama.cpp backend — currently running, OpenAI-compatible API

services:
  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/ssd/models:/models
    command: >
      --model /models/${LLAMACPP_MODEL:-nemotron-122b.gguf}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size ${LLAMACPP_CTX_SIZE:-131072}
      --parallel ${LLAMACPP_PARALLEL:-1}
      --api-key ${INFERENCE_API_KEY}
