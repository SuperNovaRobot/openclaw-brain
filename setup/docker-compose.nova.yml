services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/ssd/pgdata:/var/lib/postgresql/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    restart: unless-stopped
    network_mode: host
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms4g -Xmx4g}"
      - http.port=${ES_PORT:-9200}
    volumes:
      - /mnt/ssd/esdata:/usr/share/elasticsearch/data
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${ES_PORT:-9200}/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    mem_limit: 1g

  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/memos?sslmode=disable"
      MEMOS_PORT: "${MEMOS_PORT:-5230}"
    mem_limit: 512m

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    network_mode: host
    environment:
      CRAWL4AI_API_PORT: "${CRAWL4AI_PORT:-11235}"
    mem_limit: 3g
